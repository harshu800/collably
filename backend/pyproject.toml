[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "B",   # bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function call in default arg (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# pytest-postgresql is a transitive-env plugin that pulls in psycopg + libpq;
# this project uses asyncpg/psycopg2 directly and does not need it. Disable
# so it does not fail import on dev machines without libpq.
addopts = "-p no:pytest_postgresql"
filterwarnings = [
    "ignore::DeprecationWarning",
]
